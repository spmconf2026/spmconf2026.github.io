<script>
  window.addEventListener('DOMContentLoaded', () => {
    const folder = 'assets/img/venue/';
    const ITUList = [
      "70th year blue hall (72).jpg",
      "Visual Education Hall (72).jpg",
      "Orhan Ocalgiray conferance room (305).jpg",
      "Uzeyir Garih Senate Hall (40).png",
      "A501 (180).png",
      "A201 (140).png",
      "A101 (140).png"
    ];

    function buildCarousel(list, carouselId, innerId, add_caption) {
      const container = document.getElementById(innerId);
      const indicators = document.createElement('ol');
      indicators.className = 'carousel-indicators';

      list.forEach((file, idx) => {
        const caption = file
          .replace(/\.[^/.]+$/, '')
          .replace(/[-_]/g, ' ')
          .replace(/\b\w/g, l => l.toUpperCase());

        // Slide
        const item = document.createElement('div');
        item.className = 'carousel-item' + (idx === 0 ? ' active' : '');
        if (add_caption)
          item.innerHTML = `
          <div class="carousel-slide-wrapper">
            <img src="${folder + file}" alt="${caption}" loading="lazy">
          </div>
          <div class="carousel-caption d-none d-md-block">
            <h5>${caption}</h5>
          </div>`;
        else
          item.innerHTML = `
          <div class="carousel-slide-wrapper">
            <img src="${folder + file}" alt="${caption}" loading="lazy">
          </div>`;
        container.appendChild(item);

        // Indicator
        const dot = document.createElement('li');
        dot.setAttribute('data-target', `#${carouselId}`);
        dot.setAttribute('data-slide-to', idx);
        if (idx === 0) dot.classList.add('active');
        indicators.appendChild(dot);
      });

      const carousel = document.getElementById(carouselId);
      carousel.insertBefore(
        indicators,
        carousel.querySelector('.carousel-control-prev')
      );
    }

    // build both carousels
    buildCarousel(ITUList, 'ITUcarousel', 'carouselImagesITU', true);
  });

  $(function () {
    const $travelToggle = $('#travelDropdown');

    // 1) on page-load, if we’re on travel.html, mark it active
    const page = window.location.pathname.split('/').pop().toLowerCase();
    if (page === 'travel.html') {
      $travelToggle.addClass('active');
    }

    // 2) whenever *any* dropdown-item is clicked, highlight Travel and collapse nav
    $(document).on('click', '.dropdown-menu .dropdown-item', function (e) {
      // mark the travel button active
      $travelToggle.addClass('active');
      // hide the mobile menu
      $('.navbar-collapse').collapse('hide');
    });
  });
</script>
